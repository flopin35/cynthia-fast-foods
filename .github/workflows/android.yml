name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Signing key: uses the repository secrets if they exist (so updates install
      # over the old app). Otherwise makes a one-off key for this build.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.CFF_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CFF_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            echo "::add-mask::$KS_PASS"
            echo "CFF_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            echo "::add-mask::$P"
            keytool -genkeypair -keystore android/app/release.jks -storetype JKS -alias cynthia \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" \
              -dname "CN=Cynthia Fast Foods, O=Cynthia Fast Foods, C=GH"
            echo "CFF_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Put the APK on the website
        if: success()
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/cynthia-orders.apk
          BYTES=$(stat -c%s download/cynthia-orders.apk)
          printf '{"version":"1.%s","built":"%s","commit":"%s","bytes":%s}\n' "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" "$BYTES" > download/app-version.json
          rm -f download/build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/cynthia-orders.apk download/app-version.json
          git add -u download
          git commit -m "Android app 1.$GITHUB_RUN_NUMBER" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save the error so it can be fixed
        if: failure()
        run: |
          mkdir -p download
          tail -n 150 build.log > download/build-error.txt 2>/dev/null || echo "Build failed before Gradle ran" > download/build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/build-error.txt
          git commit -m "Android build failed (log saved)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
