plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def keyPass = System.getenv("CFF_KEYSTORE_PASSWORD")   // supplied by the GitHub build, never stored here

android {
    namespace 'com.cynthiafastfoods.orders'
    compileSdk 35

    defaultConfig {
        applicationId "com.cynthiafastfoods.orders"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword keyPass
            keyAlias "cynthia"
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
