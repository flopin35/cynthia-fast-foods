<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cynthia Orders</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E5A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cynthia Orders">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0E5A3A; --green-deep:#083A26; --mist:#E7F1EA; --gold:#F5B72A; --gold-soft:#FFF1C9;
  --hib:#C8205E; --pepper:#E8552B; --bg:#F5F6F2; --ink:#24170F; --soft:#6A5E55; --line:#E6E2DA;
  --display:"Gluten","Trebuchet MS",sans-serif; --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--hib);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:calc(var(--top) + .7rem) 1rem .9rem}
.top-row{display:flex;align-items:center;gap:.7rem}
.top svg.logo{width:36px;height:36px;flex:none}
.top h1{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1;flex:1}
.top h1 small{display:block;font-family:var(--body);font-weight:600;font-size:.75rem;color:var(--gold);margin-top:.2rem}
.net{display:flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:600;background:rgba(255,255,255,.12);padding:.3rem .6rem;border-radius:999px;white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:#2BB673}
.net.off i{background:var(--gold)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.icon-btn svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.9rem}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:.55rem .7rem}
.stat span{display:block;font-size:.72rem;color:rgba(255,255,255,.75);font-weight:600}
.stat b{font-family:var(--display);font-size:1.35rem;line-height:1.15}
.stat.hot{background:var(--gold);color:var(--green-deep)}
.stat.hot span{color:var(--green-deep)}

main{padding:1rem 1rem calc(5.5rem + var(--bot))}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:.4rem .2rem .6rem}
.sec-title h2{font-size:1rem;font-weight:700}
.sec-title span{font-size:.82rem;color:var(--soft)}

/* Order cards */
.list{display:grid;gap:.65rem}
.card{background:#fff;border-radius:18px;padding:.9rem 1rem;border:1px solid var(--line);border-left:6px solid var(--line);text-align:left;width:100%;display:block}
.card.new{border-left-color:var(--gold);box-shadow:0 6px 18px rgba(245,183,42,.18)}
.card.confirmed{border-left-color:#2BB673}
.card.cancelled{border-left-color:#C9C3BA;opacity:.65}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.ref{font-weight:700;font-size:.92rem}
.ago{font-size:.8rem;color:var(--soft);white-space:nowrap}
.cust{font-weight:700;font-size:1.05rem;margin-top:.35rem;line-height:1.25}
.items{color:var(--soft);font-size:.9rem;margin-top:.15rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-bot{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;gap:.5rem}
.tags{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.74rem;font-weight:700;padding:.18rem .55rem;border-radius:999px;background:#F2EFE9;white-space:nowrap}
.tag.new{background:var(--gold);color:var(--green-deep)}
.tag.ok{background:#E1F5EA;color:#167A45}
.tag.no{background:#EEE;color:#777}
.tag.mm{background:var(--gold-soft)}
.tag.walk{background:#FBE3EC}
.tag.bolt{background:#34D186;color:#063D1F}
.amt{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--green);white-space:nowrap}
.empty{text-align:center;color:var(--soft);padding:2.5rem 1rem;background:#fff;border-radius:18px;border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:.2rem}

/* History */
.search{display:flex;align-items:center;gap:.5rem;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.2rem .8rem;margin-bottom:.7rem}
.search svg{width:18px;height:18px;color:var(--soft);flex:none}
.search input{flex:1;border:0;outline:none;padding:.65rem 0;background:none;min-width:0}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:.5rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.45rem .85rem;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.day{margin:1.1rem .2rem .5rem;display:flex;justify-content:space-between;align-items:baseline}
.day b{font-size:.95rem}
.day span{font-size:.82rem;color:var(--soft)}
.more{display:block;margin:1rem auto 0;padding:.7rem 1.3rem;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:.4rem .5rem calc(.4rem + var(--bot))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.4rem;border-radius:12px;font-size:.78rem;font-weight:700;color:var(--soft);position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-selected="true"]{color:var(--green);background:var(--mist)}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--hib);color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 5px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(36,23,15,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:0 1.1rem calc(1.2rem + var(--bot))}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#D6D0C6;margin:.6rem auto .9rem}
.sheet h3{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--green);line-height:1.1}
.sheet .meta{color:var(--soft);font-size:.88rem;margin:.25rem 0 .9rem}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.85rem 1rem;margin-bottom:.7rem}
.box h4{font-size:.78rem;color:var(--soft);font-weight:700;margin-bottom:.35rem}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0;font-size:.95rem}
.row.tot{font-weight:700;border-top:1px dashed var(--line);margin-top:.35rem;padding-top:.5rem;font-size:1.05rem}
.row .disc{color:var(--hib)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.4rem 0 .6rem}
.act{display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.85rem;border-radius:14px;font-weight:700;text-decoration:none}
.act svg{width:20px;height:20px}
.act.call{background:var(--green);color:#fff}
.act.wa{background:#1FAF5A;color:#fff}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:calc(var(--top) + 1.5rem) 1.2rem 2rem;background:var(--green)}
.login form{background:#fff;border-radius:26px;padding:2rem 1.5rem;width:min(400px,100%);text-align:center}
.login svg{width:64px;height:64px;margin:0 auto .7rem}
.login h1{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--green);line-height:1.05}
.login p{color:var(--soft);margin:.35rem 0 1.3rem}
.login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:.85rem 1rem;margin-bottom:.7rem;font-size:1rem}
.login input:focus{outline:none;border-color:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.95rem;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:1rem}
.btn[disabled]{opacity:.6}
.msg{font-size:.9rem;margin-top:.8rem;color:#B5381A;text-align:left}

/* Menu + banner */
.menu{position:fixed;top:calc(var(--top) + 3.6rem);right:.8rem;z-index:60;background:#fff;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.2);padding:.4rem;min-width:220px}
.menu button,.menu a{display:flex;width:100%;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem .9rem;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--bg)}
.menu small{color:var(--soft);font-weight:500;font-size:.8rem}
.menu hr{border:0;border-top:1px solid var(--line);margin:.3rem 0}
.alert{position:fixed;left:.8rem;right:.8rem;top:calc(var(--top) + .6rem);z-index:70;background:var(--gold);color:var(--green-deep);border-radius:16px;padding:.85rem 1rem;font-weight:700;box-shadow:0 14px 34px rgba(0,0,0,.25);display:flex;align-items:center;gap:.7rem;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.alert.show{transform:none}
.alert span{flex:1}
.install{display:flex;align-items:center;gap:.8rem;background:#fff;border:1.5px solid var(--gold);border-radius:16px;padding:.8rem .9rem;margin-bottom:.9rem;font-size:.9rem}
.install b{display:block}
.install button{background:var(--gold);color:var(--green-deep);font-weight:700;border-radius:10px;padding:.55rem .8rem;white-space:nowrap}
.loading{text-align:center;color:var(--soft);padding:3rem 1rem}
@media (min-width:700px){ main{max-width:640px;margin:0 auto} .top-in{max-width:640px;margin:0 auto} .sheet{max-width:600px;margin:0 auto} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Login -->
<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#F5B72A"/><circle cx="24" cy="24" r="16" fill="#fff"/><path d="M13 26c0-6 5-10 11-10s11 4 11 10c0 4-5 7-11 7s-11-3-11-7z" fill="#E0662B"/><ellipse cx="29" cy="25" rx="5" ry="3.6" fill="#A0521D" transform="rotate(-25 29 25)"/></svg>
    <h1>Cynthia Orders</h1>
    <p>Log in to see your orders</p>
    <input type="email" id="email" placeholder="Email" autocomplete="username" required aria-label="Email">
    <input type="password" id="pass" placeholder="Password" autocomplete="current-password" required aria-label="Password">
    <button class="btn" id="loginBtn" type="submit">Log in</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
</section>

<!-- App -->
<div id="appView" hidden>
  <header class="top">
    <div class="top-in">
      <div class="top-row">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#F5B72A"/><circle cx="24" cy="24" r="16" fill="#fff"/><path d="M13 26c0-6 5-10 11-10s11 4 11 10c0 4-5 7-11 7s-11-3-11-7z" fill="#E0662B"/><ellipse cx="29" cy="25" rx="5" ry="3.6" fill="#A0521D" transform="rotate(-25 29 25)"/></svg>
        <h1>Cynthia<small id="viewName">Orders</small></h1>
        <span class="net" id="net"><i></i><span>Live</span></span>
        <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-haspopup="menu"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      </div>
      <div class="stats">
        <div class="stat hot" id="statNewBox"><span>New orders</span><b id="statNew">0</b></div>
        <div class="stat"><span>Today</span><b id="statToday">0</b></div>
        <div class="stat"><span>Today's income</span><b id="statIncome">GH₵0</b></div>
      </div>
    </div>
  </header>

  <main>
    <div class="install" id="installBox" hidden>
      <div style="flex:1"><b>Install this app</b><span id="installText">Add it to your home screen for quick access.</span></div>
      <button id="installBtn">Install</button>
    </div>

    <section id="ordersTab">
      <div class="sec-title"><h2>New orders</h2><span id="newCount"></span></div>
      <div class="list" id="newList"></div>
      <div class="sec-title" style="margin-top:1.3rem"><h2>Earlier today</h2><span id="todayCount"></span></div>
      <div class="list" id="todayList"></div>
    </section>

    <section id="historyTab" hidden>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search name, phone, order or dish" aria-label="Search orders"></label>
      <div class="chips" role="group" aria-label="Time period" id="rangeChips">
        <button class="chip" data-range="7" aria-pressed="true">7 days</button>
        <button class="chip" data-range="30" aria-pressed="false">30 days</button>
        <button class="chip" data-range="all" aria-pressed="false">All time</button>
      </div>
      <div class="chips" role="group" aria-label="Status" id="statusChips">
        <button class="chip" data-status="all" aria-pressed="true">All</button>
        <button class="chip" data-status="new" aria-pressed="false">New</button>
        <button class="chip" data-status="confirmed" aria-pressed="false">Confirmed</button>
        <button class="chip" data-status="cancelled" aria-pressed="false">Cancelled</button>
      </div>
      <div class="sec-title" style="margin-top:.6rem"><h2 id="histTitle">History</h2><span id="histSum"></span></div>
      <div id="histList"></div>
      <button class="more" id="moreBtn" hidden>Show more</button>
    </section>
    <div class="loading" id="loading">Loading orders…</div>
  </main>

  <nav class="nav" role="tablist" aria-label="Sections">
    <button role="tab" aria-selected="true" data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l1 4H5z"/><path d="M5 7h14v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 12h6M9 16h4"/></svg>Orders<span class="badge" id="navBadge" hidden>0</span></button>
    <button role="tab" aria-selected="false" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>History</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="menu" id="menu" role="menu" hidden>
  <button role="menuitem" id="soundBtn"><span>Alert sound</span><small id="soundState">On</small></button>
  <a role="menuitem" href="/admin" target="_blank" rel="noopener"><span>Open full dashboard</span><small>↗</small></a>
  <hr>
  <button role="menuitem" id="logoutBtn"><span>Log out</span><small id="who"></small></button>
</div>
<div class="alert" id="alert" role="status" aria-live="assertive"><span id="alertText"></span><button id="alertView" style="font-weight:800;text-decoration:underline">View</button></div>

<script>
const FIREBASE = {
  apiKey: "AIzaSyCeOcDkhFAhu4bIVTLS-WybJuFh_nkETbI",
  authDomain: "cynthia-a3d2b.firebaseapp.com",
  projectId: "cynthia-a3d2b",
  storageBucket: "cynthia-a3d2b.firebasestorage.app",
  messagingSenderId: "1066310885299",
  appId: "1:1066310885299:web:d508e4944d01fffe18b5c6"
};
const FBV = "12.0.0", CUR = "GH₵", DAY = 864e5;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => `${CUR}${Math.round(n || 0).toLocaleString("en-GH")}`;
const ls = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

let fb = null, orders = [], known = null, unsub = null, tab = "orders", range = "7", status = "all", shown = 60, soundOn = ls.get("cff-app-sound", true);

/* ---------- Data ---------- */
function norm(id, d){
  const items = Array.isArray(d.items) ? d.items.filter(i => i && i.name).map(i => ({name:String(i.name), price:+i.price || 0, q:+i.q || 0})) : [];
  return {id, ref:String(d.ref || id), ts:+d.ts || 0, items, total:+d.total || 0, subtotal:+d.subtotal || items.reduce((s,i) => s + i.price*i.q, 0), fee:+d.fee || 0,
    discounts: Array.isArray(d.discounts) ? d.discounts.map(x => ({label:String(x.label||""), amount:+x.amount||0})) : [],
    mode: ["delivery","pickup","walk-in"].includes(d.mode) ? d.mode : "delivery", pay: d.pay === "Cash" ? "Cash" : d.pay === "Bolt" ? "Bolt" : "Mobile Money",
    customer:String(d.customer||""), phone:String(d.phone||""), address:String(d.address||""), notes:String(d.notes||""),
    source:String(d.source||""), status:["new","confirmed","cancelled"].includes(d.status) ? d.status : "confirmed"};
}
const sod = (t = Date.now()) => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function ago(ts){
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`;
  if (ts >= sod()) return new Date(ts).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
  return new Date(ts).toLocaleDateString("en-GB", {day:"numeric", month:"short"}) + ", " + new Date(ts).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
}
function dayLabel(t){
  const s = sod(t);
  if (s === sod()) return "Today"; if (s === sod() - DAY) return "Yesterday";
  return new Date(t).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
}
const modeLabel = m => m === "walk-in" ? "Walk-in" : m === "pickup" ? "Pickup" : "Delivery";
const stTag = s => s === "new" ? `<span class="tag new">New</span>` : s === "cancelled" ? `<span class="tag no">Cancelled</span>` : `<span class="tag ok">Confirmed</span>`;

/* ---------- Render ---------- */
function card(o){
  const who = o.customer || (o.mode === "walk-in" ? "Walk-in customer" : "Customer");
  return `<button class="card ${o.status}" data-id="${esc(o.id)}">
    <div class="card-top"><span class="ref">${esc(o.ref)}</span><span class="ago">${ago(o.ts)}</span></div>
    <div class="cust">${esc(who)}</div>
    <div class="items">${o.items.map(i => `${i.q}× ${esc(i.name)}`).join(", ")}</div>
    <div class="card-bot"><div class="tags">${stTag(o.status)}<span class="tag ${o.mode === "walk-in" ? "walk" : ""}">${modeLabel(o.mode)}</span>${o.source === "bolt" ? `<span class="tag bolt">Bolt</span>` : `<span class="tag ${o.pay === "Cash" ? "" : "mm"}">${o.pay === "Cash" ? "Cash" : "MoMo"}</span>`}</div><span class="amt">${money(o.total)}</span></div>
  </button>`;
}
const emptyBox = (t, s) => `<div class="empty"><b>${t}</b>${s}</div>`;
function render(){
  const t0 = sod();
  const fresh = orders.filter(o => o.status === "new").sort((a,b) => b.ts - a.ts);
  const today = orders.filter(o => o.ts >= t0 && o.status !== "new").sort((a,b) => b.ts - a.ts);
  const todayValid = orders.filter(o => o.ts >= t0 && o.status !== "cancelled");
  $("#statNew").textContent = fresh.length;
  $("#statToday").textContent = todayValid.length;
  $("#statIncome").textContent = money(todayValid.reduce((s,o) => s + o.total, 0));
  $("#navBadge").hidden = !fresh.length; $("#navBadge").textContent = fresh.length;
  $("#newCount").textContent = fresh.length ? `${fresh.length} waiting` : "";
  $("#todayCount").textContent = today.length ? `${today.length} order${today.length === 1 ? "" : "s"}` : "";
  $("#newList").innerHTML = fresh.length ? fresh.map(card).join("") : emptyBox("No new orders", "New website orders appear here the moment they come in.");
  $("#todayList").innerHTML = today.length ? today.map(card).join("") : emptyBox("Nothing else today yet", "Confirmed and walk-in orders from today show here.");
  document.title = (fresh.length ? `(${fresh.length}) ` : "") + "Cynthia Orders";
  try { fresh.length ? navigator.setAppBadge && navigator.setAppBadge(fresh.length) : navigator.clearAppBadge && navigator.clearAppBadge(); } catch(e){}
  renderHistory();
}
function renderHistory(){
  const q = $("#q").value.trim().toLowerCase();
  const from = range === "all" ? 0 : sod() - (+range - 1) * DAY;
  let list = orders.filter(o => o.ts >= from && (status === "all" || o.status === status));
  if (q) list = list.filter(o => [o.ref, o.customer, o.phone, o.address, ...o.items.map(i => i.name)].join(" ").toLowerCase().includes(q));
  list.sort((a,b) => b.ts - a.ts);
  const valid = list.filter(o => o.status !== "cancelled");
  $("#histTitle").textContent = q ? "Search results" : range === "all" ? "All orders" : `Last ${range} days`;
  $("#histSum").textContent = list.length ? `${list.length} order${list.length === 1 ? "" : "s"} · ${money(valid.reduce((s,o) => s + o.total, 0))}` : "";
  if (!list.length){ $("#histList").innerHTML = emptyBox(q ? "No matches" : "No orders here", q ? "Try a different name, phone number or dish." : "Try a longer time period."); $("#moreBtn").hidden = true; return; }
  const part = list.slice(0, shown), groups = [];
  part.forEach(o => { const k = sod(o.ts); let g = groups[groups.length - 1]; if (!g || g.k !== k){ g = {k, items:[]}; groups.push(g); } g.items.push(o); });
  $("#histList").innerHTML = groups.map(g => {
    const all = list.filter(o => sod(o.ts) === g.k && o.status !== "cancelled");
    return `<div class="day"><b>${dayLabel(g.k)}</b><span>${all.length} order${all.length === 1 ? "" : "s"} · ${money(all.reduce((s,o) => s + o.total, 0))}</span></div><div class="list">${g.items.map(card).join("")}</div>`;
  }).join("");
  $("#moreBtn").hidden = list.length <= shown;
}

/* ---------- Order detail ---------- */
function intlPhone(p){ const d = String(p).replace(/\D/g, ""); return d.startsWith("0") ? "233" + d.slice(1) : d; }
function openOrder(id){
  const o = orders.find(x => x.id === id); if (!o) return;
  const d = new Date(o.ts);
  $("#sheet").innerHTML = `<div class="grab"></div>
    <h3 id="sheetTitle">${esc(o.customer || (o.mode === "walk-in" ? "Walk-in customer" : "Customer"))}</h3>
    <div class="meta">${esc(o.ref)} · ${d.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"})}, ${d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"})}</div>
    <div class="tags" style="margin-bottom:.9rem">${stTag(o.status)}<span class="tag">${modeLabel(o.mode)}</span><span class="tag ${o.pay === "Cash" ? "" : "mm"}">${esc(o.pay)}</span>${o.source === "website" ? `<span class="tag">Website</span>` : o.source === "bolt" ? `<span class="tag bolt">Bolt</span>` : ""}</div>
    ${o.phone ? `<div class="actions">
      <a class="act call" href="tel:${esc(o.phone.replace(/[^\d+]/g, ""))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Call</a>
      <a class="act wa" href="https://wa.me/${intlPhone(o.phone)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>WhatsApp</a>
    </div>` : ""}
    <div class="box"><h4>Customer</h4>
      <div class="row"><span>Name</span><span>${esc(o.customer || "—")}</span></div>
      ${o.phone ? `<div class="row"><span>Phone</span><span>${esc(o.phone)}</span></div>` : ""}
      ${o.address ? `<div class="row"><span>Address</span><span style="text-align:right">${esc(o.address)}</span></div>` : ""}
      ${o.notes ? `<div class="row"><span>Notes</span><span style="text-align:right">${esc(o.notes)}</span></div>` : ""}
    </div>
    <div class="box"><h4>Order</h4>
      ${o.items.map(i => `<div class="row"><span>${i.q} × ${esc(i.name)}</span><span>${i.price ? money(i.q*i.price) : "Free"}</span></div>`).join("")}
      ${o.discounts.map(x => `<div class="row"><span class="disc">${esc(x.label)}</span><span class="disc">−${money(x.amount)}</span></div>`).join("")}
      ${o.mode !== "walk-in" ? `<div class="row"><span>${modeLabel(o.mode)}</span><span>${o.fee ? money(o.fee) : "Free"}</span></div>` : ""}
      <div class="row tot"><span>Total (${esc(o.pay === "Bolt" ? "paid on Bolt" : o.pay)})</span><span>${money(o.total)}</span></div>
    </div>
    <button class="btn" id="closeSheet" style="margin-top:.4rem">Close</button>`;
  $("#sheet").classList.add("open"); $("#scrim").classList.add("open");
  history.pushState({sheet:1}, "");
}
function closeSheet(fromPop){ if (!$("#sheet").classList.contains("open")) return; $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); if (!fromPop && history.state && history.state.sheet) history.back(); }
window.addEventListener("popstate", () => closeSheet(true));

/* ---------- Alerts ---------- */
let audioCtx = null;
function beep(){
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sine"; o.frequency.value = 880; g.gain.setValueAtTime(.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .18); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2); });
  } catch(e){}
}
let alertTimer, alertId = null;
function alertNew(list){
  const o = list[0];
  $("#alertText").textContent = list.length === 1 ? `🔔 New ${o.source === "bolt" ? "Bolt " : ""}order ${o.ref}: ${o.customer || "Customer"}, ${money(o.total)}` : `🔔 ${list.length} new orders`;
  alertId = list.length === 1 ? o.id : null;
  $("#alert").classList.add("show"); clearTimeout(alertTimer); alertTimer = setTimeout(() => $("#alert").classList.remove("show"), 7000);
  beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){}
}

/* ---------- Firebase ---------- */
async function loadFb(){
  const base = `https://www.gstatic.com/firebasejs/${FBV}/`;
  const [a, f, au] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js"), import(base + "firebase-auth.js")]);
  const app = a.initializeApp(FIREBASE);
  let db; try { db = f.initializeFirestore(app, {localCache: f.persistentLocalCache({tabManager: f.persistentMultipleTabManager()})}); } catch(e){ db = f.getFirestore(app); }
  fb = {f, au, auth: au.getAuth(app), db};
}
function showLogin(msg){ $("#appView").hidden = true; $("#loginView").hidden = false; $("#loginMsg").innerHTML = msg || ""; }
function startLive(user){
  $("#loginView").hidden = true; $("#appView").hidden = false; $("#who").textContent = user.email || "";
  $("#loading").hidden = false;
  unsub = fb.f.onSnapshot(fb.f.collection(fb.db, "orders"), {includeMetadataChanges:true}, snap => {
    $("#loading").hidden = true;
    const list = snap.docs.map(d => norm(d.id, d.data())).filter(o => o.ts > 0);
    if (known){ const fresh = list.filter(o => !known.has(o.id) && o.status === "new"); if (fresh.length) alertNew(fresh); }
    known = new Set(list.map(o => o.id)); orders = list; render();
    const off = !!(snap.metadata && snap.metadata.fromCache) && !navigator.onLine;
    $("#net").classList.toggle("off", off); $("#net span").textContent = off ? "Offline" : "Live";
  }, err => {
    $("#loading").hidden = true;
    const c = (err && err.code) || "";
    if (c.includes("permission-denied")) showLogin(`You're logged in as <b>${esc(user.email)}</b>, but this account isn't allowed to see orders. Log in with your admin email.`);
    else $("#loading").hidden = false, $("#loading").textContent = "Lost connection. Orders will update when you're back online.";
  });
}
function stopLive(){ if (unsub){ unsub(); unsub = null; } orders = []; known = null; }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c){ openOrder(c.dataset.id); return; }
  const t = e.target.closest("button"); if (!t) { if (!e.target.closest("#menu") && !$("#menu").hidden) $("#menu").hidden = true; return; }
  if (t.dataset.tab){ tab = t.dataset.tab; document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-selected", b === t)); $("#ordersTab").hidden = tab !== "orders"; $("#historyTab").hidden = tab !== "history"; $("#viewName").textContent = tab === "orders" ? "Orders" : "Order history"; window.scrollTo(0, 0); }
  else if (t.dataset.range){ range = t.dataset.range; shown = 60; document.querySelectorAll("#rangeChips .chip").forEach(b => b.setAttribute("aria-pressed", b === t)); renderHistory(); }
  else if (t.dataset.status){ status = t.dataset.status; shown = 60; document.querySelectorAll("#statusChips .chip").forEach(b => b.setAttribute("aria-pressed", b === t)); renderHistory(); }
  else if (t.id === "moreBtn"){ shown += 60; renderHistory(); }
  else if (t.id === "closeSheet") closeSheet();
  else if (t.id === "menuBtn"){ $("#menu").hidden = !$("#menu").hidden; }
  else if (t.id === "soundBtn"){ soundOn = !soundOn; ls.set("cff-app-sound", soundOn); $("#soundState").textContent = soundOn ? "On" : "Off"; if (soundOn) beep(); }
  else if (t.id === "logoutBtn"){ $("#menu").hidden = true; fb.au.signOut(fb.auth); }
  else if (t.id === "alertView"){ $("#alert").classList.remove("show"); if (alertId) openOrder(alertId); else document.querySelector('.nav button[data-tab="orders"]').click(); }
  if (t.id !== "menuBtn" && !t.closest("#menu")) $("#menu").hidden = true;
  if (!audioCtx && soundOn){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(err){} }
});
$("#scrim").addEventListener("click", () => closeSheet());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#q").addEventListener("input", () => { shown = 60; renderHistory(); });
$("#soundState").textContent = soundOn ? "On" : "Off";
setInterval(() => { if (orders.length) render(); }, 60000);
window.addEventListener("online", () => { $("#net").classList.remove("off"); $("#net span").textContent = "Live"; });
window.addEventListener("offline", () => { $("#net").classList.add("off"); $("#net span").textContent = "Offline"; });

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "Logging in…"; $("#loginMsg").textContent = "";
  try { await fb.au.signInWithEmailAndPassword(fb.auth, $("#email").value.trim(), $("#pass").value); $("#pass").value = ""; }
  catch(err){ const c = (err && err.code) || ""; $("#loginMsg").textContent = /invalid|wrong|not-found/.test(c) ? "That email or password isn't right." : /too-many/.test(c) ? "Too many tries. Wait a few minutes." : /network/.test(c) ? "No internet connection. Try again when you're online." : "Couldn't log in. Try again."; }
  btn.disabled = false; btn.textContent = "Log in";
});

/* ---------- Install ---------- */
const IN_APK = /CynthiaOrdersApp/.test(navigator.userAgent);
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone || IN_APK;
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; if (!standalone) $("#installBox").hidden = false; });
$("#installBtn").addEventListener("click", async () => { if (deferred){ deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $("#installBox").hidden = true; } });
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)){ $("#installBox").hidden = false; $("#installText").textContent = "Tap the Share button, then “Add to Home Screen”."; $("#installBtn").hidden = true; }
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("/app/sw.js", {scope:"/app/"}).catch(() => {});

/* ---------- Start ---------- */
(async () => {
  try { await loadFb(); }
  catch(e){ showLogin("Couldn't load. Check your internet connection and reopen the app."); return; }
  fb.au.onAuthStateChanged(fb.auth, user => { if (user){ if (!unsub) startLive(user); } else { stopLive(); showLogin(""); } });
})();
</script>
</body>
</html>
